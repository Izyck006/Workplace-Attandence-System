services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./private:/app/private
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ATTENDANCE_DOMAIN=${ATTENDANCE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  caddy_data:
  caddy_config:
